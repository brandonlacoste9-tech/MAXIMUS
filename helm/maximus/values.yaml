# Default values for MAXIMUS AI Assistant
replicaCount: 1

image:
  repository: maximus-ai
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: maximus.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  AI_PROVIDER: "ollama"
  PORT: "3001"
  NODE_ENV: "production"
  OLLAMA_HOST: "http://ollama:11434"
  OLLAMA_MODEL: "llama2"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

ollama:
  enabled: true
  image: ollama/ollama:latest
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    size: 10Gi
