# Default values for MAXIMUS AI Assistant

replicaCount: 1

image:
  repository: maximus-ai
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: maximus.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

env:
  aiProvider: "ollama"
  ollamaHost: "http://ollama-service:11434"
  ollamaModel: "llama2"
  telegramEnabled: false
  whatsappEnabled: false

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: latest
  service:
    port: 11434
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    size: 10Gi
