apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maximus.fullname" . }}
  labels:
    {{- include "maximus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "maximus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "maximus.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: PORT
          value: "3000"
        - name: AI_PROVIDER
          value: {{ .Values.env.aiProvider | quote }}
        - name: OLLAMA_HOST
          value: {{ .Values.env.ollamaHost | quote }}
        - name: OLLAMA_MODEL
          value: {{ .Values.env.ollamaModel | quote }}
        - name: TELEGRAM_ENABLED
          value: {{ .Values.env.telegramEnabled | quote }}
        - name: WHATSAPP_ENABLED
          value: {{ .Values.env.whatsappEnabled | quote }}
        volumeMounts:
        - name: data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "maximus.fullname" . }}
        {{- else }}
        emptyDir: {}
        {{- end }}
