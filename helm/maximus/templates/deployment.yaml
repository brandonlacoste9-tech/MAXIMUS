apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maximus.fullname" . }}
  labels:
    {{- include "maximus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "maximus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "maximus.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: maximus
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "maximus.fullname" . }}-data
        {{- else }}
        emptyDir: {}
        {{- end }}
